services:
  postgres:
    image: postgres:16
    container_name: rustiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rustiq
      POSTGRES_USER: rustiq
      POSTGRES_PASSWORD: ${RUSTIQ_POSTGRES_PASSWORD:?Set RUSTIQ_POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rustiq -d rustiq"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - rustiq-postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: backend/src/RustIQ.Api/Dockerfile
    container_name: rustiq-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=rustiq;Username=rustiq;Password=${RUSTIQ_POSTGRES_PASSWORD:?Set RUSTIQ_POSTGRES_PASSWORD in .env}
      RustServerQuery__TimeoutMilliseconds: 3000
      RustServerQuery__OfflineThresholdSeconds: 600
      RustServerQuery__WatchedOfflineThresholdSeconds: 60
      BattleMetricsApi__Enabled: "false"
      BattleMetricsApi__Token: ${RUSTIQ_BATTLEMETRICS_TOKEN:-}
      BattleMetricsApi__MinimumRequestIntervalMilliseconds: 1100
      BattleMetricsWipeFallback__Enabled: "true"
      BattleMetricsWipeFallback__RequestTimeoutSeconds: 20
      SteamDiscovery__Enabled: "true"
      SteamDiscovery__ApiKey: ${RUSTIQ_STEAM_API_KEY:-}
      SteamDiscovery__TimeoutMilliseconds: 30000
      SteamDiscovery__MaxServersPerRefresh: 5000
      SteamDiscovery__RefreshIntervalMinutes: 10
      FacepunchDiscovery__Enabled: "true"
      FacepunchDiscovery__TimeoutMilliseconds: 60000
      FacepunchDiscovery__MaxServersPerRefresh: 15000
      BattleMetricsDiscovery__Enabled: "false"
      BattleMetricsDiscovery__PageSize: 100
      BattleMetricsDiscovery__MaxPages: 60
      BattleMetricsSummaryRefresh__Enabled: "true"
      BattleMetricsSummaryRefresh__WorkerTickSeconds: 15
      BattleMetricsSummaryRefresh__RefreshConcurrency: 16
      BattleMetricsSummaryRefresh__DirectoryRefreshIntervalMinutes: 15
      BattleMetricsSummaryRefresh__FastLaneRefreshIntervalSeconds: 45
      BattleMetricsSummaryRefresh__NormalOnlineRefreshIntervalMinutes: 3
      BattleMetricsSummaryRefresh__SlowOfflineRefreshIntervalMinutes: 20
      BattleMetricsSummaryRefresh__VeryStaleOfflineRefreshIntervalMinutes: 15
      BattleMetricsSummaryRefresh__PopularOfflineGraceMinutes: 60
      BattleMetricsSummaryRefresh__SlowOfflineAfterMinutes: 60
      BattleMetricsSummaryRefresh__VeryStaleOfflineAfterHours: 24
      BattleMetricsSummaryRefresh__PopularRankThreshold: 250
      BattleMetricsSummaryRefresh__PopularPlayerThreshold: 100
      BattleMetricsSummaryRefresh__PopularPeakPlayerThreshold: 100
      BattleMetricsSummaryRefresh__RecentPeakWindowMinutes: 60
      BattleMetricsSummaryRefresh__FastLaneBatchSize: 50
      BattleMetricsSummaryRefresh__NormalOnlineLaneBatchSize: 100
      BattleMetricsSummaryRefresh__SlowOfflineLaneBatchSize: 250
      BattleMetricsSummaryRefresh__VeryStaleOfflineLaneBatchSize: 250
      BattleMetricsSummaryRefresh__RefreshCurrentPlayers: "false"
      BattleMetricsSummaryRefresh__RefreshMapMetadata: "false"
      MapMetadataRefresh__Enabled: "true"
      MapMetadataRefresh__RunOnStartup: "true"
      MapMetadataRefresh__StartupStaleAfterHours: 8
      MapMetadataRefresh__TimeZoneId: Europe/Tallinn
      MapMetadataRefresh__LocalHours__0: 3
      MapMetadataRefresh__LocalHours__1: 18
      MapMetadataRefresh__LocalHours__2: 22
      MapMetadataRefresh__MaxServersPerRun: 1000
      MapMetadataRefresh__BatchSize: 25
      MapMetadataRefresh__DelayBetweenServersMilliseconds: 0
      MapMetadataRefresh__DelayBetweenBatchesSeconds: 1
      SnapshotRetention__Enabled: "true"
      SnapshotRetention__RetentionDays: 14
      SnapshotRetention__CleanupIntervalHours: 12
      SnapshotRetention__UnreachableServerRetentionDays: 30
      SnapshotRetention__MaxUnreachableServerDeletesPerRun: 5000
    ports:
      - "127.0.0.1:${RUSTIQ_HTTP_PORT:-5009}:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_ADSENSE_CLIENT_ID: ${VITE_ADSENSE_CLIENT_ID:-}
        VITE_ADSENSE_SLOT_SERVERS: ${VITE_ADSENSE_SLOT_SERVERS:-}
        VITE_ADSENSE_SLOT_KNOWLEDGE: ${VITE_ADSENSE_SLOT_KNOWLEDGE:-}
        VITE_ADSENSE_SLOT_MINIGAMES: ${VITE_ADSENSE_SLOT_MINIGAMES:-}
        VITE_ADSENSE_SLOT_ARTICLE: ${VITE_ADSENSE_SLOT_ARTICLE:-}
    container_name: rustiq-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "${RUSTIQ_WEB_PORT:-80}:80"

volumes:
  rustiq-postgres-data:
