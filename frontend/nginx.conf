map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/hubs/ {
    proxy_pass http://api:8080/hubs/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://api:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location ~* \.(?:png|svg|ico|webp|jpg|jpeg)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
  }

  # Server detail pages are dynamic and far too numerous to prerender, so they
  # are served a noindex shell instead of the homepage HTML.
  location ^~ /servers/ {
    try_files $uri /servers/index.html;
  }

  # Prerendered routes exist as <route>/index.html. Matching that file
  # explicitly (rather than relying on $uri/ plus the index directive) serves
  # /about directly instead of 301-ing to /about/, which would not match the
  # canonical URLs in sitemap.xml.
  location / {
    try_files $uri $uri/index.html $uri/ /index.html;
  }
}

