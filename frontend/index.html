    <script>
      // Apply the saved theme before first paint so the prerendered markup does
      // not flash dark for light-theme users (AppShell.tsx owns it afterwards).
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('rustiq-theme') === 'light' ? 'light' : 'dark'
      } catch {}

      // The prerendered text is for crawlers and no-JS visitors; with JS on,
      // React replaces it within moments, so keep it hidden until then rather
      // than flashing a text-only page. If the app has not mounted after a few
      // seconds (bundle failed to load), show the static text after all.
      document.documentElement.classList.add('prerender-pending')
      setTimeout(function () {
        document.documentElement.classList.remove('prerender-pending')
      }, 4000)
    </script>
    <script async src="https://fundingchoicesmessages.google.com/i/pub-1494964558491486?ers=1"></script>
    <script>
      (function () {
        function signalGooglefcPresent() {
          if (!window.frames['googlefcPresent']) {
            if (document.body) {
              const iframe = document.createElement('iframe')
              iframe.style = 'width: 0; height: 0; border: none; z-index: -1000; left: -1000px; top: -1000px;'
              iframe.style.display = 'none'
              iframe.name = 'googlefcPresent'
              document.body.appendChild(iframe)
            } else {
              setTimeout(signalGooglefcPresent, 0)
            }
          }
        }
        signalGooglefcPresent()
      })()
    </script>
    <script>
